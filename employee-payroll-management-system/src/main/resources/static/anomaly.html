<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Anomaly Detection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">
        <h1>Payroll Anomaly Detection</h1>

        <label>Employee ID:</label>
        <input type="number" id="employeeId">

        <br><br>

        <label>Previous Salary:</label>
        <input type="number" id="previousSalary">

        <br><br>

        <button onclick="checkAnomaly()">
            Check Anomaly
        </button>

        <p id="result"></p>

        <br>

        <button onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>
    </div>

    <script>
        function checkAnomaly() {

            const employeeId = document.getElementById("employeeId").value;
            const previousSalary = document.getElementById("previousSalary").value;

            fetch(`http://localhost:8080/employees/anomaly/${employeeId}?previousSalary=${previousSalary}`)
                .then(response => response.text())
                .then(data => {
                    document.getElementById("result").innerText = data;
                })
                .catch(error => {
                    document.getElementById("result").innerText =
                        "Unable to check payroll anomaly.";
                });
        }
    </script>

</body>
</html>
