<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Details</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>Salary Details</h1>

        <form id="salaryForm">

            <input type="number"
                   id="employeeId"
                   placeholder="Employee ID"
                   required>

            <input type="number"
                   id="basicSalary"
                   placeholder="Basic Salary"
                   required>

            <input type="number"
                   id="allowance"
                   placeholder="Allowance"
                   required>

            <input type="number"
                   id="deduction"
                   placeholder="Deduction"
                   required>

            <button type="submit">View Salary</button>

        </form>

        <p id="message"></p>

        <h2>Salary Details</h2>

        <div id="salaryDetails"></div>

        <br>

        <button onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </div>

    <script src="salary.js"></script>

</body>
</html>
