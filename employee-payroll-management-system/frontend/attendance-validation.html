<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Salary Validation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <h1>Attendance–Salary Validation</h1>

    <label>Employee ID:</label>
    <input type="number" id="employeeId">

    <br><br>

    <label>Present Days:</label>
    <input type="number" id="presentDays">

    <br><br>

    <label>Total Working Days:</label>
    <input type="number" id="totalDays">

    <br><br>

    <button onclick="validateAttendance()">
        Validate Attendance
    </button>

    <p id="result"></p>

    <br>

    <button onclick="window.location.href='dashboard.html'">
        Back to Dashboard
    </button>

</div>

<script>
    function validateAttendance() {

        const employeeId =
            document.getElementById("employeeId").value;

        const presentDays =
            document.getElementById("presentDays").value;

        const totalDays =
            document.getElementById("totalDays").value;

        fetch(`http://localhost:8080/employees/attendance-validation/${employeeId}?presentDays=${presentDays}&totalDays=${totalDays}`)
            .then(response => response.text())
            .then(data => {
                document.getElementById("result").innerText = data;
            })
            .catch(error => {
                document.getElementById("result").innerText =
                    "Unable to validate attendance.";
            });
    }
</script>

</body>
</html>
